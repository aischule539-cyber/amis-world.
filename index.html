
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ami's world ♡</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4e5d8;color:#755448;font-family:'Trebuchet MS',sans-serif;text-align:center}
main{max-width:480px;margin:auto;padding:16px}
h1{font-family:cursive;font-size:36px;margin:10px 0 0}
small{color:#a17c70}
.card{background:#fff8ef;border:2px solid #dfc3b3;border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 4px 0 #e8d0c3}
.room{height:290px;background:linear-gradient(#f5dbd2 72%,#dcbca8 72%);position:relative;overflow:hidden}
.window{position:absolute;top:18px;left:20px;width:100px;height:125px;background:#cde3da;border:8px solid #b68e79;border-radius:55px 55px 8px 8px}
.plant{position:absolute;right:16px;top:60px;font-size:58px}
.rug{position:absolute;bottom:12px;left:15%;width:70%;height:78px;background:#e8b8ba;border-radius:50%}
.bunny{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);width:150px;height:150px;animation:bob 2s ease-in-out infinite}
.ear{position:absolute;top:-14px;width:43px;height:105px;background:#fff9ef;border:4px solid #96796b;border-radius:50%}
.ear:after{content:"";position:absolute;inset:10px;background:#efc5c5;border-radius:50%}
.left{left:15px;transform:rotate(-23deg)}
.right{right:15px;transform:rotate(23deg)}
.face{position:absolute;bottom:0;width:150px;height:115px;background:#fff9ef;border:4px solid #96796b;border-radius:48%}
.eye{position:absolute;top:45px;width:11px;height:15px;background:#60463e;border-radius:50%}
.eye.a{left:38px}.eye.b{right:38px}
.cheek{position:absolute;top:65px;width:22px;height:12px;background:#f3bfc1;border-radius:50%}
.cheek.a{left:22px}.cheek.b{right:22px}
.nose{position:absolute;top:65px;left:67px;color:#b47d83}
@keyframes bob{50%{transform:translateX(-50%) translateY(-8px)}}
.stats{text-align:left;font-size:14px}
.bar{height:12px;background:#ebd7cc;border-radius:20px;overflow:hidden;margin:6px 0 13px}
.fill{height:100%;border-radius:20px;transition:width .3s}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{background:#fff8ef;border:2px solid #d9b7a8;border-radius:16px;padding:15px 8px;color:#76574d;font-weight:bold;font-size:15px;cursor:pointer}
button:active{transform:scale(.96)}
nav{display:flex;gap:6px}
nav button{flex:1;font-size:12px;padding:12px 3px}
input{width:100%;padding:12px;border:2px solid #d9b7a8;border-radius:12px;font-size:16px}
#message{min-height:24px;color:#a5757d}
</style>
</head>
<body>
<main>
<h1>ami's world ♡</h1>
<small>our little place</small>
<p>🥕 <span id="carrots">20</span> &nbsp; ⭐ <span id="stars">3</span></p>

<section id="home">
<div class="card room">
<div class="window"></div>
<div class="plant">🌿</div>
<div class="rug"></div>
<div class="bunny">
<div class="ear left"></div>
<div class="ear right"></div>
<div class="face">
<div class="eye a"></div>
<div class="eye b"></div>
<div class="cheek a"></div>
<div class="cheek b"></div>
<div class="nose">♥</div>
</div>
</div>
</div>

<div class="card">
<h2 id="petname">Unser Häschen ♡</h2>
<p id="message">Willkommen zu Hause!</p>
<div class="stats">
🥕 Sättigung <span id="foodnum"></span>
<div class="bar"><div id="foodbar" class="fill" style="background:#dda579"></div></div>
♡ Glück <span id="joynum"></span>
<div class="bar"><div id="joybar" class="fill" style="background:#df9da8"></div></div>
☾ Energie <span id="energynum"></span>
<div class="bar"><div id="energybar" class="fill" style="background:#aaa0d3"></div></div>
</div>
</div>

<div class="actions">
<button onclick="act('feed')">🥕 Füttern</button>
<button onclick="act('pet')">♡ Streicheln</button>
<button onclick="act('play')">🧸 Spielen</button>
<button onclick="act('sleep')">🌙 Schlafen</button>
</div>

<div class="card" id="namebox">
<p>Wie soll euer Häschen heißen?</p>
<input id="nameinput" placeholder="Name ...">
<button onclick="rename()">Namen vergeben ♡</button>
</div>
</section>

<section id="shop" style="display:none" class="card">
<h2>Kleiner Laden 🧺</h2>
<p>Kleine Geschenke für euren Hasen!</p>
<p><button onclick="buy('carrot',2)">🥕 5 Karotten — 2 ⭐</button></p>
<p><button onclick="buy('flower',5)">🌼 Blumenkranz — 5 ⭐</button></p>
<p><button onclick="buy('teddy',8)">🧸 Teddybär — 8 ⭐</button></p>
<p id="shopmsg"></p>
<h3>Unsere Items</h3>
<div id="items"></div>
</section>

<section id="diary" style="display:none" class="card">
<h2>Unser Tagebuch 📖</h2>
<div id="entries"></div>
</section>

<br>
<nav>
<button onclick="show('home')">🏡 Zuhause</button>
<button onclick="show('shop')">🧺 Shop</button>
<button onclick="show('diary')">📖 Tagebuch</button>
</nav>
<p><small>made with ♡ for ami</small></p>
</main>

<script>
let state;
try {
state=JSON.parse(localStorage.getItem("amiGame"));
} catch(e) {}
state=state||{
name:"",food:72,joy:80,energy:65,
carrots:20,stars:3,diary:[],items:[]
};
state.items=state.items||[];
state.diary=state.diary||[];

function save(){
localStorage.setItem("amiGame",JSON.stringify(state));
render();
}

function render(){
document.getElementById("petname").textContent=state.name||"Unser Häschen ♡";
document.getElementById("carrots").textContent=state.carrots;
document.getElementById("stars").textContent=state.stars;
for(let key of ["food","joy","energy"]){
document.getElementById(key+"bar").style.width=state[key]+"%";
document.getElementById(key+"num").textContent=state[key]+"%";
}
document.getElementById("namebox").style.display=state.name?"none":"block";
document.getElementById("entries").replaceChildren();
state.diary.forEach(entry=>{
let p=document.createElement("p");
p.textContent="♡ "+entry;
document.getElementById("entries").appendChild(p);
});
document.getElementById("items").replaceChildren();
state.items.forEach(item=>{
let p=document.createElement("p");
p.textContent="♡ "+item;
document.getElementById("items").appendChild(p);
});
}

function act(type){
let message="";
if(type==="feed"){
if(state.carrots<1){
message="Keine Karotten mehr!";
}else{
state.carrots--;
state.food=Math.min(100,state.food+20);
message="Mmmh, lecker! 🥕";
}
}
if(type==="pet"){
state.joy=Math.min(100,state.joy+15);
message="So gemütlich! ♡";
}
if(type==="play"){
if(state.energy<10){
message="Unser Häschen ist zu müde!";
}else{
state.joy=Math.min(100,state.joy+20);
state.energy=Math.max(0,state.energy-10);
state.stars++;
message="Juhu! +1 Stern ⭐";
}
}
if(type==="sleep"){
state.energy=Math.min(100,state.energy+25);
message="Süße Träume 🌙";
}
document.getElementById("message").textContent=message;
state.diary.unshift(message);
save();
}

function rename(){
let n=document.getElementById("nameinput").value.trim();
if(!n)return;
state.name=n.slice(0,25);
state.diary.unshift("Willkommen, "+state.name+"!");
save();
}

function buy(item,cost){
if(state.stars<cost){
document.getElementById("shopmsg").textContent="Nicht genug Sterne!";
return;
}
state.stars-=cost;
if(item==="carrot"){
state.carrots+=5;
}else{
state.items.push(item==="flower"?"🌼 Blumenkranz":"🧸 Teddybär");
}
document.getElementById("shopmsg").textContent="Gekauft! ♡";
state.diary.unshift("Ein Geschenk gekauft ♡");
save();
}

function show(tab){
for(let id of ["home","shop","diary"]){
document.getElementById(id).style.display=id===tab?"block":"none";
}
}
render();
</script>
</body>
  </html>
